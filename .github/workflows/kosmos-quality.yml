name: Kosmos - Quality gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kosmos-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Kosmos T3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Kosmos T3
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run fmt:check

      - name: Check code quality
        run: bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Run tests
        run: bun run test
